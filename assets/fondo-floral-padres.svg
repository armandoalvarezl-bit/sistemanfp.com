<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="paper" x2="0.15" y2="1">
      <stop stop-color="#fffaf7"/>
      <stop offset=".52" stop-color="#fff8f3"/>
      <stop offset="1" stop-color="#faece8"/>
    </linearGradient>
    <radialGradient id="petal" cx="35%" cy="30%">
      <stop stop-color="#fffdfb"/>
      <stop offset=".58" stop-color="#f9dfe1"/>
      <stop offset="1" stop-color="#e7aab7"/>
    </radialGradient>
    <radialGradient id="petalRose" cx="35%" cy="30%">
      <stop stop-color="#fff8f7"/>
      <stop offset=".6" stop-color="#f2c4c9"/>
      <stop offset="1" stop-color="#d9899b"/>
    </radialGradient>
    <radialGradient id="heart" cx="35%" cy="30%">
      <stop stop-color="#f7df9c"/>
      <stop offset="1" stop-color="#ba8c48"/>
    </radialGradient>
    <g id="rose">
      <g fill="url(#petalRose)" stroke="#d89ba4" stroke-opacity=".36" stroke-width="1.2">
        <ellipse cy="-20" rx="13" ry="22"/>
        <ellipse transform="rotate(45)" cy="-20" rx="13" ry="22"/>
        <ellipse transform="rotate(90)" cy="-20" rx="13" ry="22"/>
        <ellipse transform="rotate(135)" cy="-20" rx="13" ry="22"/>
        <ellipse transform="rotate(180)" cy="-20" rx="13" ry="22"/>
        <ellipse transform="rotate(225)" cy="-20" rx="13" ry="22"/>
        <ellipse transform="rotate(270)" cy="-20" rx="13" ry="22"/>
        <ellipse transform="rotate(315)" cy="-20" rx="13" ry="22"/>
      </g>
      <g fill="url(#petal)" stroke="#dfadb2" stroke-opacity=".4" stroke-width="1">
        <ellipse cy="-11" rx="8" ry="13"/>
        <ellipse transform="rotate(60)" cy="-11" rx="8" ry="13"/>
        <ellipse transform="rotate(120)" cy="-11" rx="8" ry="13"/>
        <ellipse transform="rotate(180)" cy="-11" rx="8" ry="13"/>
        <ellipse transform="rotate(240)" cy="-11" rx="8" ry="13"/>
        <ellipse transform="rotate(300)" cy="-11" rx="8" ry="13"/>
      </g>
      <circle r="5.5" fill="url(#heart)"/>
    </g>
    <g id="sprig" fill="#a9b397" stroke="#899778" stroke-width="1.1" stroke-linecap="round">
      <path d="M0 0Q32-28 73-64" fill="none"/>
      <ellipse cx="18" cy="-17" rx="7" ry="15" transform="rotate(-50 18 -17)"/>
      <ellipse cx="34" cy="-35" rx="7" ry="15" transform="rotate(30 34 -35)"/>
      <ellipse cx="51" cy="-48" rx="7" ry="15" transform="rotate(-48 51 -48)"/>
      <ellipse cx="12" cy="-8" rx="6" ry="13" transform="rotate(38 12 -8)"/>
      <ellipse cx="39" cy="-25" rx="6" ry="13" transform="rotate(-38 39 -25)"/>
      <ellipse cx="62" cy="-54" rx="6" ry="13" transform="rotate(35 62 -54)"/>
    </g>
    <g id="cluster">
      <use href="#sprig" transform="rotate(-18)"/>
      <use href="#sprig" transform="translate(7 2) rotate(52) scale(.82)"/>
      <use href="#rose" transform="translate(52 -36) scale(1.12)"/>
      <use href="#rose" transform="translate(0 9) scale(.66)"/>
      <g fill="#fffdf7" stroke="#e7d4b2" stroke-width=".8">
        <circle cx="78" cy="-20" r="5"/><circle cx="89" cy="-25" r="3.5"/><circle cx="71" cy="-8" r="3.5"/>
