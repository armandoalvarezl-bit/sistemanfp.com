  <rect width="800" height="1100" fill="url(#paper)"/>
  <path d="M0 0H800V1100H0Z" fill="none" stroke="#d7bd8a" stroke-opacity=".32" stroke-width="2"/>
  <g opacity=".95">
    <use href="#cluster" transform="translate(-6 33) scale(1.35)"/>
    <use href="#cluster" transform="translate(806 45) scale(-1.28 1.28)"/>
    <use href="#cluster" transform="translate(13 1071) rotate(18) scale(1.35)"/>
    <use href="#cluster" transform="translate(791 1073) scale(-1.3 1.3) rotate(14)"/>
    <use href="#rose" transform="translate(17 450) scale(.43)" opacity=".54"/>
    <use href="#rose" transform="translate(781 662) scale(.42)" opacity=".5"/>
  </g>
  <g fill="#d5bd89" opacity=".48">
    <circle cx="122" cy="190" r="2.5"/><circle cx="686" cy="184" r="2"/>
    <circle cx="90" cy="794" r="2"/><circle cx="724" cy="865" r="2.5"/>
    <path d="m106 282 4 9 9 4-9 4-4 9-4-9-9-4 9-4z"/>
    <path d="m699 390 3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
    <path d="m117 900 3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
  </g>
